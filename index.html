<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TeleDrive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/latin.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0e1a;
            --bg-2: #0f1424;
            --card: rgba(22, 28, 45, 0.65);
            --card-solid: #161c2d;
            --primary: #0a84ff;
            --primary-2: #5e5ce6;
            --accent: #64d2ff;
            --success: #30d158;
            --danger: #ff453a;
            --warning: #ffd60a;
            --text: #f5f5f7;
            --text-secondary: #8e8e93;
            --text-tertiary: #636366;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.14);
            --hover: rgba(255, 255, 255, 0.05);
            --sidebar-bg: rgba(15, 20, 32, 0.72);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        body.light {
            --bg: #f5f5f7;
            --bg-2: #ffffff;
            --card: rgba(255, 255, 255, 0.7);
            --card-solid: #ffffff;
            --primary: #007aff;
            --primary-2: #5856d6;
            --accent: #32ade6;
            --text: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #aeaeb2;
            --border: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.14);
            --hover: rgba(0, 0, 0, 0.04);
            --sidebar-bg: rgba(255, 255, 255, 0.72);
        }

        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 { width: 500px; height: 500px; background: #0a84ff; top: -150px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: #bf5af2; bottom: -100px; right: -50px; }
        .orb-3 { width: 350px; height: 350px; background: #64d2ff; top: 40%; left: 50%; opacity: 0.35; }
        .orb-4 { width: 300px; height: 300px; background: #ff375f; bottom: 20%; left: 20%; opacity: 0.3; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.1); }
            66% { transform: translate(-40px, 50px) scale(0.95); }
        }

        .app {
            position: relative;
            z-index: 2;
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 0.9rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.6rem 0.9rem;
            margin-bottom: 1.8rem;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0a84ff, #5e5ce6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
        }

        .logo-text {
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-section-label {
            padding: 0.5rem 1rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.92rem;
            cursor: pointer;
            margin-bottom: 2px;
        }

        .nav-item:hover:not(.active) {
            background: var(--hover);
            color: var(--text);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(10, 132, 255, 0.18), rgba(94, 92, 230, 0.14));
            color: var(--text);
            font-weight: 600;
        }

        .storage-card {
            margin-top: auto;
            margin: auto 0.3rem 0.3rem 0.3rem;
            background: linear-gradient(135deg, rgba(10, 132, 255, 0.12), rgba(94, 92, 230, 0.08));
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.1rem;
        }

        .storage-amount {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .storage-amount span {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .progress-bg {
            height: 6px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
            margin: 0.5rem 0;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 20px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .top-bar {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--sidebar-bg);
            gap: 1rem;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .page-title .count {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--hover);
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
        }

        .top-actions-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--hover);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.55rem 1rem;
            width: 280px;
        }

        .search-wrapper input {
            background: transparent;
            border: none;
            color: var(--text);
            width: 100%;
            outline: none;
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--hover);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sort-select {
            background: var(--hover);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.55rem 0.9rem;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
        }

        .content {
            flex: 1;
            padding: 1.8rem 2rem;
            overflow-y: auto;
        }

        .upload-area {
            border-radius: var(--radius-xl);
            padding: 2.2rem;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            cursor: pointer;
        }

        .upload-icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(10, 132, 255, 0.2), rgba(94, 92, 230, 0.15));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        .upload-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            border: none;
            padding: 0.75rem 1.8rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }

        .file-card {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 1.2rem;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background: var(--card-solid);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-xl);
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--hover);
            border: none;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Settings Form Styles */
        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            position: relative;
        }

        .settings-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .settings-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .settings-group input {
            background: var(--hover);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 3.5rem 0.75rem 1rem;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        .settings-group input:focus {
            border-color: var(--primary);
        }

        .paste-btn {
            position: absolute;
            right: 8px;
            background: var(--border-strong);
            border: none;
            color: var(--text);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .paste-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Recent list section inside Settings Modal */
        .recent-section {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 160px;
            overflow-y: auto;
        }

        .recent-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-tertiary);
            letter-spacing: 0.05em;
        }

        .recent-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--hover);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            font-size: 0.82rem;
            gap: 0.5rem;
        }

        .recent-row-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            font-family: monospace;
            color: var(--text-secondary);
        }

        .recent-row-label {
            font-weight: 600;
            color: var(--text);
            font-family: inherit;
            margin-right: 0.5rem;
        }

        .recent-actions {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .recent-action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .recent-action-btn.copy {
            color: var(--warning);
        }

        .recent-action-btn.copy:hover {
            background: rgba(255, 214, 10, 0.15);
        }

        .recent-action-btn.delete {
            color: var(--danger);
        }

        .recent-action-btn.delete:hover {
            background: rgba(255, 69, 58, 0.15);
        }

        .settings-save-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(10, 132, 255, 0.3);
        }

        .hidden {
            display: none !important;
        }

        .mobile-nav {
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .top-bar { padding: 0.8rem 1rem; flex-wrap: wrap; }
            .content { padding: 1rem; padding-bottom: 80px; }
            .mobile-nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 60px;
                background: var(--sidebar-bg);
                border-top: 1px solid var(--border);
                z-index: 100;
                justify-content: space-around;
                align-items: center;
            }
            .mobile-nav-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                color: var(--text-secondary);
                font-size: 0.7rem;
                cursor: pointer;
            }
            .mobile-nav-item.active {
                color: var(--primary);
                font-weight: 600;
            }
        }
    </style>
</head>

<body>
    <div class="bg-canvas">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <div class="app">
        <!-- Desktop Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-cloud"></i></div>
                <div class="logo-text">TeleDrive</div>
            </div>

            <div class="nav-section-label">Library</div>
            <nav>
                <div class="nav-item active" data-view="all">
                    <i class="fas fa-folder"></i>
                    <span>All Files</span>
                    <span class="nav-badge" id="badgeAll">0</span>
                </div>
                <div class="nav-item" data-view="images">
                    <i class="fas fa-image"></i>
                    <span>Images</span>
                    <span class="nav-badge" id="badgeImages">0</span>
                </div>
                <div class="nav-item" data-view="videos">
                    <i class="fas fa-video"></i>
                    <span>Videos</span>
                    <span class="nav-badge" id="badgeVideos">0</span>
                </div>
                <div class="nav-item" data-view="documents">
                    <i class="fas fa-file-alt"></i>
                    <span>Documents</span>
                    <span class="nav-badge" id="badgeDocs">0</span>
                </div>
                <div class="nav-item" data-view="audio">
                    <i class="fas fa-music"></i>
                    <span>Audio</span>
                    <span class="nav-badge" id="badgeAudio">0</span>
                </div>
                <div class="nav-item" style="background-color:blue;">
                    <i class="fas fa-heart"></i>
                    <span><a href="special.html" style="text-decoration: none; color:#30d158;">Love</a></span>
                </div>
            </nav>

            <div class="storage-card">
                <div class="storage-amount"><span id="storageUsed">0 MB</span> <span>/ Unlimited</span></div>
                <div class="progress-bg"><div class="progress-fill" id="storageBar"></div></div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main">
            <header class="top-bar">
                <div class="page-title">
                    <span id="viewTitle">All Files</span>
                    <span class="count" id="fileCount">0</span>
                </div>
                <div class="top-actions-wrapper">
                    <div class="search-wrapper">
                        <i class="fas fa-search" style="color:var(--text-tertiary); margin-right:0.5rem;"></i>
                        <input type="text" id="searchInput" placeholder="Search files...">
                    </div>
                    <div class="actions">
                        <select class="sort-select" id="sortSelect">
                            <option value="date-desc">Newest</option>
                            <option value="date-asc">Oldest</option>
                            <option value="name-asc">Name A–Z</option>
                        </select>
                        <button class="icon-btn" id="settingsToggle" title="Settings"><i class="fas fa-gear"></i></button>
                        <button class="icon-btn" id="themeToggle" title="Toggle theme"><i class="fas fa-moon"></i></button>
                    </div>
                </div>
            </header>

            <div class="content">
                <div class="upload-area" id="dropZone">
                    <div class="upload-icon-wrap"><i class="fas fa-cloud-upload-alt" style="font-size:1.8rem; color:var(--primary);"></i></div>
                    <h3>Drop files to upload</h3>
                    <p style="color:var(--text-secondary); margin:0.5rem 0 1rem;">or tap to browse files</p>
                    <input type="file" id="fileInput" multiple hidden>
                    <button class="upload-btn" id="browseBtn"><i class="fas fa-plus"></i> Choose Files</button>
                </div>

                <div id="progressContainer" class="progress-modal hidden"></div>
                <div class="file-grid" id="fileGrid"></div>
            </div>
        </main>
    </div>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
        <div class="mobile-nav-item active" data-view="all"><i class="fas fa-folder"></i><span>All</span></div>
        <div class="mobile-nav-item" data-view="images"><i class="fas fa-image"></i><span>Images</span></div>
        <div class="mobile-nav-item" data-view="videos"><i class="fas fa-video"></i><span>Videos</span></div>
        <div class="mobile-nav-item" data-view="documents"><i class="fas fa-file-alt"></i><span>Docs</span></div>
    </nav>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Settings</div>
                <button class="modal-close" id="closeSettingsBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="settings-form">
                <div class="settings-group">
                    <label for="inputBotToken">BOT_TOKEN</label>
                    <div class="settings-input-wrapper">
                        <input type="text" id="inputBotToken" placeholder="Enter Bot Token">
                        <button type="button" class="paste-btn" id="pasteTokenBtn"><i class="fas fa-paste"></i> Paste</button>
                    </div>
                    <div class="recent-section" id="recentTokensContainer">
                        <div class="recent-section-title">Recent Bot Tokens</div>
                        <div id="recentTokensList"></div>
                    </div>
                </div>

                <div class="settings-group">
                    <label for="inputChatName">NAME FOR CHAT_ID</label>
                    <input type="text" id="inputChatName" placeholder="e.g. My Backup Channel">
                </div>

                <div class="settings-group">
                    <label for="inputChatId">CHAT_ID</label>
                    <div class="settings-input-wrapper">
                        <input type="text" id="inputChatId" placeholder="Enter Chat ID">
                        <button type="button" class="paste-btn" id="pasteChatBtn"><i class="fas fa-paste"></i> Paste</button>
                    </div>
                    <div class="recent-section" id="recentChatsContainer">
                        <div class="recent-section-title">Recent Chat IDs</div>
                        <div id="recentChatsList"></div>
                    </div>
                </div>

                <button class="settings-save-btn" id="saveSettingsBtn">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="previewTitle">File Preview</div>
                <button class="modal-close" id="closePreviewBtn"><i class="fas fa-times"></i></button>
            </div>
            <div id="previewContent"></div>
        </div>
    </div>

    <script>
        (function () {
            const STORAGE_KEY = 'teledrive_files_v2';
            const SETTINGS_KEY = 'teledrive_settings';

            let savedSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
            let BOT_TOKEN = savedSettings.botToken || '8682853483:AAGAYIWkf_k0BAck3Gp2FkMkZg4mGh7x2tc';
            let CHAT_ID = savedSettings.chatId || '-1004428694157';
            let CHAT_NAME = savedSettings.chatName || '';

            let recentTokens = savedSettings.recentTokens || [BOT_TOKEN];
            let recentChats = savedSettings.recentChats || [{ id: CHAT_ID, name: CHAT_NAME || 'Default Chat' }];

            const $ = id => document.getElementById(id);
            const settingsToggle = $('settingsToggle');
            const settingsModal = $('settingsModal');
            const closeSettingsBtn = $('closeSettingsBtn');
            const inputBotToken = $('inputBotToken');
            const inputChatId = $('inputChatId');
            const inputChatName = $('inputChatName');
            const pasteTokenBtn = $('pasteTokenBtn');
            const pasteChatBtn = $('pasteChatBtn');
            const recentTokensList = $('recentTokensList');
            const recentChatsList = $('recentChatsList');
            const saveSettingsBtn = $('saveSettingsBtn');
            const themeToggle = $('themeToggle');

            function showToast(msg, type = 'info') {
                document.querySelectorAll('.toast').forEach(t => t.remove());
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.style.cssText = 'position:fixed; top:1.5rem; left:50%; transform:translateX(-50%); background:#161c2d; color:#fff; padding:0.8rem 1.3rem; border-radius:14px; z-index:9999; font-size:0.9rem; border:1px solid rgba(255,255,255,0.14);';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }

            function renderRecentLists() {
                // Tokens
                recentTokensList.innerHTML = '';
                if (recentTokens.length === 0) {
                    recentTokensList.innerHTML = '<div style="font-size:0.8rem; color:var(--text-tertiary);">No recent tokens</div>';
                } else {
                    recentTokensList.innerHTML = recentTokens.map((t, idx) => `
                        <div class="recent-row">
                            <span class="recent-row-text" title="${t}">${t}</span>
                            <div class="recent-actions">
                                <button class="recent-action-btn copy" onclick="window.useRecentToken('${t}')">copy</button>
                                <button class="recent-action-btn delete" onclick="window.deleteRecentToken(${idx})">Delete</button>
                            </div>
                        </div>
                    `).join('');
                }

                // Chats
                recentChatsList.innerHTML = '';
                if (recentChats.length === 0) {
                    recentChatsList.innerHTML = '<div style="font-size:0.8rem; color:var(--text-tertiary);">No recent chat IDs</div>';
                } else {
                    recentChatsList.innerHTML = recentChats.map((c, idx) => {
                        const chatId = typeof c === 'object' ? c.id : c;
                        const chatName = typeof c === 'object' ? c.name : '';
                        return `
                            <div class="recent-row">
                                <span class="recent-row-text" title="${chatId}">
                                    ${chatName ? `<span class="recent-row-label">${chatName}</span>` : ''}
                                    ${chatId}
                                </span>
                                <div class="recent-actions">
                                    <button class="recent-action-btn copy" onclick="window.useRecentChat('${chatId}', '${chatName}')">copy</button>
                                    <button class="recent-action-btn delete" onclick="window.deleteRecentChat(${idx})">Delete</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            }

            window.useRecentToken = (val) => { inputBotToken.value = val; showToast('Copied to input', 'success'); };
            window.deleteRecentToken = (idx) => { recentTokens.splice(idx, 1); renderRecentLists(); };

            window.useRecentChat = (idVal, nameVal) => { 
                inputChatId.value = idVal; 
                inputChatName.value = nameVal || '';
                showToast('Copied to input', 'success'); 
            };
            window.deleteRecentChat = (idx) => { recentChats.splice(idx, 1); renderRecentLists(); };

            settingsToggle.addEventListener('click', () => {
                inputBotToken.value = BOT_TOKEN;
                inputChatId.value = CHAT_ID;
                inputChatName.value = CHAT_NAME;
                renderRecentLists();
                settingsModal.classList.remove('hidden');
            });

            closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));

            async function handlePaste(inputEl) {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        inputEl.value = text.trim();
                        showToast('Pasted successfully', 'success');
                    }
                } catch (e) {
                    showToast('Clipboard access denied', 'error');
                }
            }

            pasteTokenBtn.addEventListener('click', () => handlePaste(inputBotToken));
            pasteChatBtn.addEventListener('click', () => handlePaste(inputChatId));

            saveSettingsBtn.addEventListener('click', () => {
                const newToken = inputBotToken.value.trim();
                const newChatId = inputChatId.value.trim();
                const newChatName = inputChatName.value.trim();

                if (!newToken || !newChatId) {
                    showToast('Please fill out both Bot Token and Chat ID', 'error');
                    return;
                }

                BOT_TOKEN = newToken;
                CHAT_ID = newChatId;
                CHAT_NAME = newChatName;

                if (!recentTokens.includes(newToken)) recentTokens.unshift(newToken);
                
                // Avoid duplicate chat entries
                if (!recentChats.some(c => (typeof c === 'object' ? c.id : c) === newChatId)) {
                    recentChats.unshift({ id: newChatId, name: newChatName });
                } else {
                    // Update name if already exists
                    let existing = recentChats.find(c => (typeof c === 'object' ? c.id : c) === newChatId);
                    if (existing && typeof existing === 'object') existing.name = newChatName;
                }

                localStorage.setItem(SETTINGS_KEY, JSON.stringify({
                    botToken: BOT_TOKEN,
                    chatId: CHAT_ID,
                    chatName: CHAT_NAME,
                    recentTokens,
                    recentChats,
                    theme: document.body.classList.contains('light') ? 'light' : 'dark'
                }));

                settingsModal.classList.add('hidden');
                showToast('Settings saved!', 'success');
            });

            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light');
                const isLight = document.body.classList.contains('light');
                themeToggle.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
                let current = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
                current.theme = isLight ? 'light' : 'dark';
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(current));
            });

            if (savedSettings.theme === 'light') {
                document.body.classList.add('light');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
        })();
    </script>
</body>

</html>
